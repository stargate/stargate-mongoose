name: Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATA_API_URI: http://localhost:8181/v1/testks1
      DATA_API_USERNAME: cassandra
      DATA_API_PASSWORD: cassandra
    steps:
      - uses: actions/checkout@v3
      - name: Set up Data API
        run: |
          chmod +x bin/start_data_api.sh
          bin/start_data_api.sh
      - name: Wait for services
        run: |
          while ! nc -z localhost 8181; do sleep 1; done
      - name: Setting up the node version
        uses: actions/setup-node@v3
        with:
          node-version: 20.19.0
      - name: setup project
        run: npm i
      - name: copy env file
        run: cp .env.example .env
      - name: Create test keyspace with RF=1
        run: |
          docker compose -f bin/docker-compose.yml exec -T dse-1 \
                cqlsh -u cassandra -p cassandra -e "CREATE KEYSPACE IF NOT EXISTS testks1 WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
      - name: Check keyspace replication
        run: |
          docker compose -f bin/docker-compose.yml exec -T dse-1 \
            cqlsh -u cassandra -p cassandra -e "DESCRIBE KEYSPACE testks1;"
      - name: Warm up Cassandra collections
        run: |
          npm run warm-up-tests
      - name: run tests
        run: |
          npm run test-dataapi
  e2e:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        typescript-version: ["5", "7"]
    name: e2e (typescript@${{ matrix.typescript-version }})
    steps:
      - uses: actions/checkout@v3
      - name: Setting up the node version
        uses: actions/setup-node@v3
        with:
          node-version: 20.19.0
      - name: setup project
        run: npm i
      - name: build
        run: npm run build
      - name: pack
        run: node ./bin/create-tarball.js
      - name: install smoke test
        working-directory: ./tests/e2e
        run: npm install
      - name: run e2e smoke test
        working-directory: ./tests/e2e
        run: node .
      - name: install typescript ${{ matrix.typescript-version }}
        working-directory: ./tests/e2e
        run: npm install --no-save typescript@${{ matrix.typescript-version }}
      - name: run e2e typescript compilation test
        working-directory: ./tests/e2e
        run: npx tsc
